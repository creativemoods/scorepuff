name: Android checks and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate release identity
        id: identity
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 tools/release.py validate --tag "$RELEASE_TAG" --output artifacts/unsigned/release.json
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Install Android build tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.1"'
      - name: Check release tooling
        run: python3 -m unittest discover -s tools/tests -v
      - name: Test, lint and build unsigned release
        run: ./gradlew --no-daemon --no-configuration-cache -PunsignedRelease testDebugUnitTest lintRelease assembleRelease
      - name: Collect unsigned APK
        if: startsWith(github.ref, 'refs/tags/')
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk artifacts/unsigned/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: unsigned-release
          path: artifacts/unsigned/
          if-no-files-found: error
          retention-days: 1

  sign:
    if: github.repository == 'creativemoods/scorepuff' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: android-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install signing tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.1"'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-release
          path: artifacts/unsigned
      - name: Sign and verify with the existing ScorePuff key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          python3 tools/release.py sign
          --apk artifacts/unsigned/app-release-unsigned.apk
          --metadata artifacts/unsigned/release.json
          --destination artifacts/signed
          --build-tools "$ANDROID_HOME/build-tools/35.0.1"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release
          path: |
            artifacts/signed/app-release.apk
            artifacts/signed/app-release.apk.sha256
            artifacts/signed/release.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release
          path: artifacts
      - name: Publish verified APK immediately
        working-directory: artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          sha256sum --check app-release.apk.sha256
          actual_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha)
          test "$actual_commit" = "$RELEASE_COMMIT"
          # Upload all assets to a temporary draft, then publish together without review.
          # Existing releases are never overwritten; a failed draft is removed manually before retrying.
          gh release create "$RELEASE_TAG" --verify-tag --draft \
            --title "ScorePuff ${RELEASE_TAG#v}" --generate-notes \
            app-release.apk app-release.apk.sha256 release.json
          gh release edit "$RELEASE_TAG" --draft=false --latest
